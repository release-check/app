name: app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      - name: Build index
        run: bun run build:index

      - name: Eval demo
        run: bun run eval:demo

      - name: Eval verified
        run: bun run eval:verified

      - name: Validate provenance
        run: bun run validate:provenance
